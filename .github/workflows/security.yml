name: Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday 09:30 Asia/Taipei (01:30 UTC).
    - cron: "30 1 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: root
            path: .
          - name: dashboard
            path: dashboard
          - name: server
            path: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package.path }}/package-lock.json

      - name: Audit dependencies
        working-directory: ${{ matrix.package.path }}
        run: npm audit --audit-level=high

      - name: Save full audit report
        if: always()
        working-directory: ${{ matrix.package.path }}
        run: npm audit --json > "${{ runner.temp }}/npm-audit-${{ matrix.package.name }}.json" || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.package.name }}
          path: ${{ runner.temp }}/npm-audit-${{ matrix.package.name }}.json
          if-no-files-found: ignore

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
