name: Dashboard Build and FHIR Import Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Typecheck and build
        working-directory: dashboard
        run: npm run build
      - name: Parser unit tests
        working-directory: dashboard
        run: npx vitest run src/parsers/nhi-parser.test.ts src/parsers/fhir-parser.test.ts
